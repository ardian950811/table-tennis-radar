
name: Update Table Tennis Matches

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: update-table-tennis-matches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download BetsAPI matches
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
        run: |
          set -e
          mkdir -p data/history

          TODAY=$(TZ=Europe/Rome date +%Y%m%d)

          curl -fsS --retry 3 --get \
            "https://api.b365api.com/v3/events/upcoming" \
            --data-urlencode "sport_id=92" \
            --data-urlencode "day=$TODAY" \
            --data-urlencode "page=1" \
            --data-urlencode "token=$BETSAPI_TOKEN" \
            -o data/upcoming-page-0001.json

          jq -e '.success == 1' data/upcoming-page-0001.json > /dev/null

          TOTAL=$(jq -r '.pager.total // 0' data/upcoming-page-0001.json)
          PER_PAGE=$(jq -r '.pager.per_page // 50' data/upcoming-page-0001.json)

          if [ "$PER_PAGE" -lt 1 ]; then
            echo "Invalid page size"
            exit 1
          fi

          PAGES=$(( (TOTAL + PER_PAGE - 1) / PER_PAGE ))

          if [ "$PAGES" -gt 100 ]; then
            PAGES=100
          fi

          if [ "$PAGES" -gt 1 ]; then
            for PAGE in $(seq 2 "$PAGES"); do
              PADDED=$(printf "%04d" "$PAGE")

              curl -fsS --retry 3 --get \
                "https://api.b365api.com/v3/events/upcoming" \
                --data-urlencode "sport_id=92" \
                --data-urlencode "day=$TODAY" \
                --data-urlencode "page=$PAGE" \
                --data-urlencode "token=$BETSAPI_TOKEN" \
                -o "data/upcoming-page-$PADDED.json"

              jq -e '.success == 1' "data/upcoming-page-$PADDED.json" > /dev/null
            done
          fi

          jq -s '{
            success: 1,
            pager: .[0].pager,
            results: [ .[] | .results[] ]
          }' data/upcoming-page-*.json > data/upcoming.json

          rm data/upcoming-page-*.json

          curl -fsS --retry 3 --get \
            "https://api.b365api.com/v3/events/inplay" \
            --data-urlencode "sport_id=92" \
            --data-urlencode "token=$BETSAPI_TOKEN" \
            -o data/inplay.json

          jq -e '.success == 1' data/inplay.json > /dev/null

          echo "Scheduled matches: $(jq '.results | length' data/upcoming.json)"
          echo "LIVE matches: $(jq '.results | length' data/inplay.json)"

      - name: Download match histories
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
        run: |
          set -e
          mkdir -p data/history

          COUNT=0
          MAX_HISTORY_PER_RUN=100

          jq -r -s '
            [.[].results[]? | .id | tostring]
            | unique[]
          ' data/upcoming.json data/inplay.json > /tmp/event-ids.txt

          while read -r EVENT_ID; do
            [ -n "$EVENT_ID" ] || continue

            HISTORY_FILE="data/history/${EVENT_ID}.json"

            if [ -f "$HISTORY_FILE" ] && jq -e '.success == 1' "$HISTORY_FILE" > /dev/null 2>&1; then
              continue
            fi

            if [ "$COUNT" -ge "$MAX_HISTORY_PER_RUN" ]; then
              echo "History limit reached"
              break
            fi

            echo "Downloading history for event $EVENT_ID"

            TEMP_FILE="${HISTORY_FILE}.tmp"

            if curl -fsS --retry 2 --get \
              "https://api.b365api.com/v1/event/history" \
              --data-urlencode "event_id=$EVENT_ID" \
              --data-urlencode "qty=20" \
              --data-urlencode "token=$BETSAPI_TOKEN" \
              -o "$TEMP_FILE"; then

              if jq -e '.success == 1 and (.results | type == "object")' "$TEMP_FILE" > /dev/null; then
                mv "$TEMP_FILE" "$HISTORY_FILE"
                COUNT=$((COUNT + 1))
              else
                echo "Invalid history response for event $EVENT_ID"
                rm -f "$TEMP_FILE"
              fi
            else
              echo "History request failed for event $EVENT_ID"
              rm -f "$TEMP_FILE"
            fi

            sleep 0.2

          done < /tmp/event-ids.txt

          echo "New histories downloaded: $COUNT"
          echo "Total history files: $(find data/history -maxdepth 1 -name '*.json' | wc -l)"

      - name: Save match data safely
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/ttr-output/history

          cp data/upcoming.json /tmp/ttr-output/upcoming.json
          cp data/inplay.json /tmp/ttr-output/inplay.json
          cp -a data/history/. /tmp/ttr-output/history/

          for ATTEMPT in 1 2 3 4 5; do
            echo "GitHub update attempt: $ATTEMPT"

            git fetch origin main

            git reset --hard origin/main

            mkdir -p data/history

            cp /tmp/ttr-output/upcoming.json data/upcoming.json
            cp /tmp/ttr-output/inplay.json data/inplay.json
            cp -a /tmp/ttr-output/history/. data/history/

            git add data/upcoming.json data/inplay.json data/history/

            if git diff --cached --quiet; then
              echo "No new data to save"
              exit 0
            fi

            git commit -m "Update table tennis matches"

            if git push origin HEAD:main; then
              echo "Data updated successfully"
              exit 0
            fi

            echo "Push rejected, retrying..."
            sleep 3
          done

          echo "Unable to update repository after 5 attempts"
          exit 1
