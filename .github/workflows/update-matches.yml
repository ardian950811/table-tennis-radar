
name: Update Table Tennis Matches

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write

concurrency:
  group: update-table-tennis-matches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download BetsAPI matches
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
        run: |
          set -e
          mkdir -p data/history data/h2h-details

          TODAY=$(TZ=Europe/Rome date +%Y%m%d)

          download_pages() {
            ENDPOINT="$1"
            OUTPUT="$2"

            curl -fsS --retry 3 --get \
              "https://api.b365api.com/v3/events/$ENDPOINT" \
              --data-urlencode "sport_id=92" \
              --data-urlencode "day=$TODAY" \
              --data-urlencode "page=1" \
              --data-urlencode "token=$BETSAPI_TOKEN" \
              -o /tmp/page-0001.json

            jq -e '.success == 1' /tmp/page-0001.json >/dev/null

            TOTAL=$(jq -r '.pager.total // 0' /tmp/page-0001.json)
            PER_PAGE=$(jq -r '.pager.per_page // 50' /tmp/page-0001.json)
            [ "$PER_PAGE" -gt 0 ] || exit 1

            PAGES=$(( (TOTAL + PER_PAGE - 1) / PER_PAGE ))
            [ "$PAGES" -le 100 ] || PAGES=100

            for PAGE in $(seq 2 "$PAGES"); do
              PADDED=$(printf "%04d" "$PAGE")
              curl -fsS --retry 3 --get \
                "https://api.b365api.com/v3/events/$ENDPOINT" \
                --data-urlencode "sport_id=92" \
                --data-urlencode "day=$TODAY" \
                --data-urlencode "page=$PAGE" \
                --data-urlencode "token=$BETSAPI_TOKEN" \
                -o "/tmp/page-$PADDED.json"
              jq -e '.success == 1' "/tmp/page-$PADDED.json" >/dev/null
            done

            jq -s '{
              success: 1,
              pager: .[0].pager,
              results: [ .[] | .results[]? ]
            }' /tmp/page-*.json > "$OUTPUT"

            rm -f /tmp/page-*.json
          }

          download_pages upcoming data/upcoming.json
          download_pages ended data/ended.json

          curl -fsS --retry 3 --get \
            "https://api.b365api.com/v3/events/inplay" \
            --data-urlencode "sport_id=92" \
            --data-urlencode "token=$BETSAPI_TOKEN" \
            -o data/inplay.json

          jq -e '.success == 1' data/inplay.json >/dev/null

          echo "Programmate: $(jq '.results | length' data/upcoming.json)"
          echo "LIVE: $(jq '.results | length' data/inplay.json)"
          echo "Concluse: $(jq '.results | length' data/ended.json)"

      - name: Download match histories
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
        run: |
          set -e
          mkdir -p data/history

          jq -r -s '
            (
              [.[0].results[]? | .id | tostring] +
              [.[1].results[]? | .id | tostring] +
              [.[2].results[]? | .id | tostring]
            )
            | reduce .[] as $id
                ([]; if index($id) then . else . + [$id] end)
            | .[]
          ' data/upcoming.json data/inplay.json data/ended.json > /tmp/event-ids.txt

          COUNT=0
          MAX_HISTORY_PER_RUN=100

          while read -r EVENT_ID; do
            [ -n "$EVENT_ID" ] || continue
            FILE="data/history/${EVENT_ID}.json"

            if [ -f "$FILE" ] && jq -e '.success == 1' "$FILE" >/dev/null 2>&1; then
              continue
            fi

            if [ "$COUNT" -ge "$MAX_HISTORY_PER_RUN" ]; then
              echo "History limit reached"
              break
            fi

            echo "Downloading history $EVENT_ID"

            if curl -fsS --retry 2 --get \
              "https://api.b365api.com/v1/event/history" \
              --data-urlencode "event_id=$EVENT_ID" \
              --data-urlencode "qty=20" \
              --data-urlencode "token=$BETSAPI_TOKEN" \
              -o "$FILE.tmp"; then

              if jq -e '.success == 1 and (.results | type == "object")' "$FILE.tmp" >/dev/null; then
                mv "$FILE.tmp" "$FILE"
                COUNT=$((COUNT + 1))
              else
                rm -f "$FILE.tmp"
              fi
            else
              rm -f "$FILE.tmp"
            fi

            sleep 0.2
          done < /tmp/event-ids.txt

          echo "Nuovi storici scaricati: $COUNT"

      - name: Download H2H set scores
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
        run: |
          set -e
          mkdir -p data/h2h-details

          find data/history -maxdepth 1 -name '*.json' -print0 |
            xargs -0 -r jq -r '.results.h2h[]?.id // empty' |
            sort -u > /tmp/all-h2h-ids.txt

          : > /tmp/missing-h2h-ids.txt

          while read -r ID; do
            [ -n "$ID" ] || continue
            [ -f "data/h2h-details/${ID}.json" ] || echo "$ID" >> /tmp/missing-h2h-ids.txt
          done < /tmp/all-h2h-ids.txt

          COUNT=0
          MAX_DETAILS_PER_RUN=100

          while [ -s /tmp/missing-h2h-ids.txt ] && [ "$COUNT" -lt "$MAX_DETAILS_PER_RUN" ]; do
            IDS=$(head -n 10 /tmp/missing-h2h-ids.txt | paste -sd, -)
            BATCH_COUNT=$(echo "$IDS" | tr ',' '\n' | wc -l)

            echo "Downloading H2H details: $IDS"

            if curl -fsS --retry 2 --get \
              "https://api.b365api.com/v1/event/view" \
              --data-urlencode "event_id=$IDS" \
              --data-urlencode "token=$BETSAPI_TOKEN" \
              -o /tmp/h2h-view.json; then

              if jq -e '.success == 1' /tmp/h2h-view.json >/dev/null; then
                while read -r ID; do
                  [ -n "$ID" ] || continue

                  jq --arg id "$ID" '
                    {
                      success: 1,
                      results: [
                        .results[]?
                        | select((.id | tostring) == $id)
                      ]
                    }
                  ' /tmp/h2h-view.json > "data/h2h-details/${ID}.json"

                  if ! jq -e '.results | length > 0' "data/h2h-details/${ID}.json" >/dev/null; then
                    rm -f "data/h2h-details/${ID}.json"
                  fi
                done < <(echo "$IDS" | tr ',' '\n')
              fi
            fi

            COUNT=$((COUNT + BATCH_COUNT))
            head -n 10 /tmp/missing-h2h-ids.txt > /tmp/processed.txt
            tail -n +11 /tmp/missing-h2h-ids.txt > /tmp/remaining.txt
            mv /tmp/remaining.txt /tmp/missing-h2h-ids.txt
            sleep 0.3
          done

          echo "ID H2H elaborati in questo aggiornamento: $COUNT"
          echo "Dettagli H2H salvati: $(find data/h2h-details -name '*.json' | wc -l)"

      - name: Save match data safely
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/ttr-output/history /tmp/ttr-output/h2h-details

          cp data/upcoming.json /tmp/ttr-output/upcoming.json
          cp data/inplay.json /tmp/ttr-output/inplay.json
          cp data/ended.json /tmp/ttr-output/ended.json
          cp -a data/history/. /tmp/ttr-output/history/
          cp -a data/h2h-details/. /tmp/ttr-output/h2h-details/

          for ATTEMPT in 1 2 3 4 5; do
            echo "Tentativo GitHub: $ATTEMPT"

            git fetch origin main
            git reset --hard origin/main

            mkdir -p data/history data/h2h-details

            cp /tmp/ttr-output/upcoming.json data/upcoming.json
            cp /tmp/ttr-output/inplay.json data/inplay.json
            cp /tmp/ttr-output/ended.json data/ended.json
            cp -a /tmp/ttr-output/history/. data/history/
            cp -a /tmp/ttr-output/h2h-details/. data/h2h-details/

            git add data/upcoming.json data/inplay.json data/ended.json data/history/ data/h2h-details/

            if git diff --cached --quiet; then
              echo "Nessun nuovo dato da salvare"
              exit 0
            fi

            git commit -m "Update table tennis data"

            if git push origin HEAD:main; then
              echo "Aggiornamento completato"
              exit 0
            fi

            echo "Push non riuscito, nuovo tentativo..."
            sleep 3
          done

          echo "Impossibile aggiornare GitHub"
          exit 1
